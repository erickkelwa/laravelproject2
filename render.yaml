databases:
  - name: student-management-db
    databaseName: student_management
    user: db_user
    plan: free
    region: oregon # or frankfurt, ohio, singapore

services:
  - type: web
    name: student-management-app
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: "Student Management System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        # This will be automatically populated with your render URL if left empty, 
        # or you can set it after deployment.
        value: "" 
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: student-management-db
          property: connectionString
      - key: FORCE_HTTPS
        value: true
      # Include cache/queue drivers if necessary
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
